[project]
name = "aiohttp-asgi"
version = "0.6.1"
description = "Adapter to running ASGI applications on aiohttp"
authors = [{ name = "Dmitry Orlov", email = "me@mosquito.su" }]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["aiohttp", "asgi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
]
dependencies = [
    "aiohttp>=3,<4",
    # Linux is the usual server platform, so the workers option works
    # there without an additional step.
    "forklib>=0.5,<0.6 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.17 ; sys_platform != 'win32'"]
rloop = ["rloop>=0.5 ; sys_platform != 'win32' and python_version >= '3.10'"]

[project.scripts]
aiohttp-asgi = "aiohttp_asgi.__main__:main"

[project.urls]
Homepage = "https://github.com/mosquito/aiohttp-asgi"
Source = "https://github.com/mosquito/aiohttp-asgi"
Tracker = "https://github.com/mosquito/aiohttp-asgi/issues"
Documentation = "https://github.com/mosquito/aiohttp-asgi/blob/master/README.md"

[dependency-groups]
dev = [
    "coveralls>=3.3.1",
    "fastapi>=0.88",
    "forklib>=0.5,<0.6 ; sys_platform != 'win32'",
    "pytest>=7.2",
    "pytest-aiohttp>=1.0.4",
    "pytest-cov>=4",
    "ruff>=0.8",
]
mypy = [
    "mypy>=1.13",
]

[tool.uv]
default-groups = [
    "dev",
    "mypy",
]

[tool.uv.build-backend]
module-name = ["aiohttp_asgi"]
module-root = ""
source-include = ["tests/**"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
follow_imports = "silent"
no_implicit_reexport = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = false
disable_error_code = "override"
files = [
    "aiohttp_asgi",
    "tests",
]


[[tool.mypy.overrides]]
module = ["forklib"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
disable_error_code = "no-untyped-def"

[tool.ruff]
line-length = 80
exclude = [
    ".git",
    ".tox",
    ".venv",
    # The benchmarks are a separate script collection, not package code.
    "benchmarks",
    "build",
    "dist",
    "env",
]

[tool.ruff.lint]
select = ["E", "W", "F", "C90"]
ignore = ["C901"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
