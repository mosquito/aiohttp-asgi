[project]
name = "aiohttp-asgi-benchmarks"
version = "0.0.0"
description = "FastAPI application benchmarks for ASGI servers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp-asgi",
    "aiohttp==3.14.5",
    "anycorn==0.20.1",
    "daphne==4.2.3",
    "granian==2.8.5",
    "gunicorn==26.2.0",
    "httptools==0.9.0",
    "hypercorn==0.18.0",
    "uvicorn==0.54.0",
    "uvicorn-worker==0.4.0",
    "uvloop==0.23.0",
    "rloop==0.5.0",
    "forklib==0.5.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pytest==7.4.4",
    "pytest-asyncio==0.21.2",
    "pytest-aiohttp==1.0.5",
]

[tool.uv]
package = false
# Match the HTTP stack used for the recorded measurements.
constraint-dependencies = ["multidict==7.1.0"]

[tool.uv.sources]
aiohttp-asgi = { path = "..", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
